[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netrax"
version = "2.0.0"
description = "NETRAX: a standalone, fully local vision hub (faces, people, pose, hands, objects) with a web dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ravada Siddharth" }]
dependencies = [
    "opencv-python>=5.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psutil>=5.9",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
netrax = "netrax.cli:main"

[tool.setuptools.packages.find]
include = ["netrax*"]

[tool.setuptools.package-data]
"netrax" = ["hub/static/*", "db/migrations/*.sql", "config.default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded ONNX models (skipped if missing)"]
